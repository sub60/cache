[workspace]
members = ["nix-types", "tests"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# 3rd-party dependencies.
axum = { version = "0.8", default-features = false }
base64 = "0.22"
cauchy = { git = "https://github.com/nomad/cauchy.git" }
compact_str = "0.9"
derive_more = { version = "2", default-features = false }
ed25519-dalek = "2"
either = "1"
futures = "0.3"
memchr = "2"
rand_core = "0.10"
serde = "1"
serde_json = "1"
sha2 = "0.11"
smallvec = "1"
smol_str = "0.3"
tempfile = "3"
tokio = { version = "1", default-features = false }
tower-layer = "0.3"
tower-service = "0.3"
url = "2"

# Internal dependencies.
nix-types = { path = "./nix-types" }
sub60-cache = { path = "." }
sub60-cache-tests = { path = "./tests" }

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
bool_to_int_with_if = "deny"
cognitive_complexity = "deny"
let_underscore_future = "allow"
module_inception = "allow"
multiple_crate_versions = "deny"
needless_collect = "deny"
same_name_method = "deny"
std_instead_of_core = "warn"
too_many_arguments = "deny"
too_many_lines = "deny"
trivially_copy_pass_by_ref = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
use_self = "warn"
wildcard_dependencies = "deny"
wildcard_imports = "warn"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "allow", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[package]
name = "sub60-cache"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { workspace = true, features = ["query"] }
cauchy = { workspace = true }
compact_str = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
nix-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { workspace = true, features = ["serde"] }
smol_str = { workspace = true, features = ["serde"] }
tower-layer = { workspace = true }
tower-service = { workspace = true }
url = { workspace = true, features = ["serde"] }

[lints]
workspace = true
