[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
cauchy = { git = "https://github.com/nomad/cauchy.git" }
compact_str = "0.9"
derive_more = { version = "2", default-features = false }
ed25519-dalek = "2"
either = "1"
memchr = "2"
serde = "1"
smallvec = "1"
smol_str = "0.3"
tempfile = "3"
tokio = { version = "1", default-features = false }
tower-layer = "0.3"
tower-service = "0.3"
url = "2"

[workspace.lints.clippy]
alloc_instead_of_core = "warn"
bool_to_int_with_if = "deny"
cognitive_complexity = "deny"
let_underscore_future = "allow"
module_inception = "allow"
multiple_crate_versions = "deny"
needless_collect = "deny"
same_name_method = "deny"
std_instead_of_core = "warn"
too_many_arguments = "deny"
too_many_lines = "deny"
trivially_copy_pass_by_ref = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
use_self = "warn"
wildcard_dependencies = "deny"
wildcard_imports = "warn"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
nonstandard_style = { level = "deny", priority = -1 }
refining_impl_trait = { level = "allow", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[package]
name = "cache"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["local-server"]
local-server = ["dep:tokio", "tokio/net", "tokio/rt-multi-thread"]
loopback-object-gateway = ["dep:tokio", "tokio/net"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
cauchy = { workspace = true }
compact_str = { workspace = true }
derive_more = { workspace = true, features = ["display"] }
ed25519-dalek = { workspace = true }
either = { workspace = true }
memchr = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smallvec = { workspace = true }
smol_str = { workspace = true, features = ["serde"] }
tempfile = { workspace = true }
tower-layer = { workspace = true }
tower-service = { workspace = true }

tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
url = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "local"
required-features = ["local-server"]
