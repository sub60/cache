name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy server to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_version: 2.29.2
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.CACHE_DB_DEPLOY_KEY }}
      - name: Deploy server to Cloudflare Workers
        env:
          CACHE_DEPLOY_TOKEN: ${{ secrets.CACHE_DEPLOY_TOKEN }}
        run: |
          nix run .#deploy
