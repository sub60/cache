name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy server to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_version: 2.29.2
      - name: Deploy server to Cloudflare Workers
        env:
          CACHE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          nix run .#deploy
